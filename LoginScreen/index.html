<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Form</title>
    <link rel="stylesheet" href="../output.css" />
  </head>
  <body
    class="bg-gray-900 flex flex-col items-center justify-center min-h-screen px-4"
  >
    <div class="bg-gray-800 p-8 rounded-xl shadow-2xl max-w-md w-full">
      <h2 class="text-3xl text-center text-white mb-6 font-bold">Login Form</h2>
      <form class="space-y-5">
        <div>
          <label
            for="email"
            class="block text-sm font-medium text-gray-200 mb-2"
            >Email</label
          >
          <input
            class="w-full px-4 py-2 rounded-md bg-gray-600 border-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div>
          <label
            for="password"
            class="block text-sm font-medium text-gray-200 mb-2"
            >Password</label
          >
          <input
            class="w-full px-4 py-2 rounded-md bg-gray-600 border-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
          />
        </div>
        <button
          type="submit"
          class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 shadow-2xl font-semibold transition"
        >
          Login
        </button>
        <button
          type="reset"
          class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 shadow-2xl font-semibold transition"
        >
          Reset
        </button>
      </form>
    </div>
  </body>
</html>
